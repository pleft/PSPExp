# PSPExp (pspexp-bt): Bluetooth audio with nobody logged in at the board. The
# console is a system service, and WirePlumber otherwise starts its Bluetooth
# monitor only for a user with an active seat: on the GameShell the earbuds
# paired but would not connect ("a2dp-sink profile connect failed: Protocol
# not available"). Installed by pspexp-core into /etc/wireplumber/wireplumber.conf.d/.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
