# PSPExp (every Debian board; shipped in pspexp-core): a route whose link is down is not used (the USB network's, from a computer's
# Internet Sharing, outlived the cable and sent all traffic nowhere: apt and the downloads failed)
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv4.conf.default.ignore_routes_with_linkdown = 1
net.ipv6.conf.all.ignore_routes_with_linkdown = 1
net.ipv6.conf.default.ignore_routes_with_linkdown = 1
