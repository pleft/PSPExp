# PSPExp access point for the PSP (GameShell in PSP mode). The PSP-1000
# joins WPA (TKIP) but not WPA2-only networks: mixed WPA/WPA2.
interface=wlan0
driver=nl80211
ssid=PSPExp
hw_mode=g
channel=6
ieee80211n=0
wmm_enabled=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=3
wpa_passphrase=pspexp-gameshell
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP CCMP
rsn_pairwise=CCMP
